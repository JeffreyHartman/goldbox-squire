# Character record layout for Curse of the Azure Bonds.
#
# Source: docs/gbc/Resources/Character file formats/02. Curse of the Azure Bonds.txt
# from Gold Box Companion v2.65, cross-checked against the game-by-game
# comparison in `Offsets compared.txt` next to it.
#
# UNVERIFIED against a live game: no install of it was on hand when this
# table was written. The offsets and enums are the documented ones; the
# game folder and the sixty-minus transform await a real install.
#
# This file describes only the fields that Goldbox Squire reads or validates.
# The record holds more. Add a field here rather than adding code.

id = "curse-of-the-azure-bonds"
game = "Curse of the Azure Bonds"
game_folder = "CURSE"   # unverified
start = "START.EXE"
machine = "ega"
record_len = 422   # offsets 0x000 through 0x1A5

# One file per character: CHRDAT{slot}{index}.SAV in the save folder
[saves]
shape = "chrdat"
extension = "SAV"

[[field]]
name = "name"
offset = 0x000
len = 16          # one length byte, then fifteen characters
kind = "pascal_string"

[[field]]
name = "strength"
offset = 0x011
len = 1
kind = "u8"

[[field]]
name = "intelligence"
offset = 0x013
len = 1
kind = "u8"

[[field]]
