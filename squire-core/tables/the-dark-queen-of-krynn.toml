# Character record layout for The Dark Queen of Krynn.
#
# Source: docs/gbc/Resources/Character file formats/07. The Dark Queen of Krynn.txt
# from Gold Box Companion v2.65, cross-checked against the game-by-game
# comparison in `Offsets compared.txt` next to it.
#
# Verified against the default-party save files the Steam install on this
# machine ships: every record decodes to a coherent character, and the
# sixty-minus armor class and THAC0 read back sane. Not yet verified against
# live emulator memory.
#
# This file describes only the fields that Goldbox Squire reads or validates.
# The record holds more. Add a field here rather than adding code.

id = "the-dark-queen-of-krynn"
game = "The Dark Queen of Krynn"
game_folder = "DQK"   # verified: the Steam install on this machine
start = "START.BAT"
machine = "svga_s3"
record_len = 414   # offsets 0x000 through 0x19D

# The whole party sits in one SAVGAM{slot}.QSV file. The header matches
# Unlimited Adventures': the party size at 1037 and the first record at 1039,
# verified against the SAVGAMA.QSV the Steam install ships (size byte 6, and
# the first name sits at exactly 1039 + 0x68). The cap keeps the stale record
# copies in the file's tail from reading as phantom party members.
[saves]
shape = "party_file"
extension = "QSV"
party_size_offset = 1037
first_record_offset = 1039

[[field]]
name = "name"
offset = 0x068
len = 16          # fifteen characters, then the terminator
kind = "terminated_string"

[[field]]
name = "strength"
offset = 0x079
len = 1
kind = "u8"

[[field]]
name = "intelligence"
offset = 0x07B
len = 1
kind = "u8"

