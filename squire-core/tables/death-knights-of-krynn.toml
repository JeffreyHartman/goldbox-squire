offset = 0x01D
len = 1
kind = "u8"

[[field]]
name = "thac0_base"
offset = 0x01F
len = 1
kind = "u8"
transform = "sixty_minus"

[[field]]
name = "race"
offset = 0x020
len = 1
kind = "enum"
