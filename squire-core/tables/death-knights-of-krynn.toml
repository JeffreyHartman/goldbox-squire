# Character record layout for Death Knights of Krynn.
#
# Source: docs/gbc/Resources/Character file formats/06. Death Knights of Krynn.txt
# from Gold Box Companion v2.65, cross-checked against the game-by-game
# comparison in `Offsets compared.txt` next to it.
#
# Verified against the default-party save files the Steam install on this
# machine ships: every record decodes to a coherent character, and the
# sixty-minus armor class and THAC0 read back sane. Not yet verified against
# live emulator memory.
#
# This file describes only the fields that Goldbox Squire reads or validates.
# The record holds more. Add a field here rather than adding code.

id = "death-knights-of-krynn"
game = "Death Knights of Krynn"
game_folder = "DKK"   # verified: the Steam install on this machine
start = "START.EXE"
machine = "ega"
record_len = 216   # offsets 0x000 through 0x0D7

# the save files are CHRDAT*.GAM here, not .SAV
[saves]
shape = "chrdat"
extension = "GAM"

[[field]]
name = "name"
offset = 0x000
len = 16          # one length byte, then fifteen characters
kind = "pascal_string"

[[field]]
name = "strength"
offset = 0x011
len = 1
kind = "u8"

[[field]]
name = "intelligence"
offset = 0x013
len = 1
kind = "u8"

[[field]]
name = "wisdom"
offset = 0x015
len = 1
kind = "u8"

[[field]]
name = "dexterity"
offset = 0x017
len = 1
kind = "u8"

[[field]]
