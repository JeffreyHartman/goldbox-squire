# Character record layout for Pool of Radiance.
#
# Source: docs/gbc/Resources/Character file formats/01. Pool of Radiance.txt
# from Gold Box Companion v2.65, cross-checked against docs/hackdocs/CCHFORM.TXT
# from the Unlimited Adventures Hacker's Guide.
#
# This file describes only the fields that Goldbox Squire reads or validates.
# The record holds more. Add a field here rather than adding code.

game = "Pool of Radiance"
record_len = 285   # offsets 0x000 through 0x11C

[[field]]
name = "name"
offset = 0x000
len = 16          # one length byte, then fifteen characters
kind = "pascal_string"

[[field]]
name = "strength"
offset = 0x010
len = 1
kind = "u8"

