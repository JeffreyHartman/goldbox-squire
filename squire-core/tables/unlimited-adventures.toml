# Character record layout for Unlimited Adventures (FRUA).
#
# Source: docs/gbc/Resources/Character file formats/10. Unlimited Adventures.txt
# from Gold Box Companion v2.65, cross-checked against docs/hackdocs/CCHFORM.TXT
# from the Unlimited Adventures Hacker's Guide, and verified against a real
# SAVGAMA.CSV: a level 1 human paladin read back with THAC0 20 (raw 40) and
# base AC 10 (raw 50), so the sixty-minus trick holds here too.
#
# This file describes only the fields that Goldbox Squire reads or validates.
# The record holds more. Add a field here rather than adding code.
#
# The name is not a length-prefixed string here: fifteen characters at 0x060,
# then a terminator byte. That is what `terminated_string` means.

id = "unlimited-adventures"
game = "Unlimited Adventures"
game_folder = "UA"
start = "START.BAT"   # runs `ckit SB220 SI7 RB330`, both GOG and Steam ship it
machine = "svga_s3"   # a 1993 VGA title
record_len = 398   # offsets 0x000 through 0x18D

# Saves live per design (adventure module): UA/{design}.DSN/SAVE/SAVGAM{slot}.CSV
# holds the whole party. The offsets were verified against a live save: the
# party size sits at 1037 and the first character record starts at 1039
# (docs/hackdocs/SAVGAM.TXT).
[saves]
shape = "party_file"
extension = "CSV"
designs = true
party_size_offset = 1037
first_record_offset = 1039

[[field]]
name = "name"
offset = 0x060
len = 16          # fifteen characters, then the terminator
kind = "terminated_string"

# The current ability scores. The originals sit interleaved one byte before
# each; Squire shows what the character is now.
[[field]]
name = "strength"
offset = 0x071
len = 1
kind = "u8"

[[field]]
name = "intelligence"
offset = 0x073
len = 1
kind = "u8"

[[field]]
name = "wisdom"
offset = 0x075
len = 1
kind = "u8"

[[field]]
