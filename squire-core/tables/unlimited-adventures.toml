# FRUA numbers its races differently from Pool of Radiance: elf is 0, human 5.
[enums.race]
0x00 = "elf"
0x01 = "half-elf"
0x02 = "dwarf"
0x03 = "gnome"
0x04 = "halfling"
0x05 = "human"
0x06 = "monster"

[enums.gender]
0x00 = "male"
0x01 = "female"

# Class 1 is the Krynn engine's knight slot; FRUA inherited it but never
# writes it for a player character. The doc calls 0x11 "illegal type".
[enums.class]
0x00 = "cleric"
0x01 = "knight"
0x02 = "fighter"
0x03 = "paladin"
0x04 = "ranger"
0x05 = "mage"
0x06 = "thief"
0x07 = "monk"
0x08 = "cleric/fighter"
0x09 = "cleric/fighter/mage"
0x0A = "cleric/ranger"
0x0B = "cleric/mage"
0x0C = "cleric/thief"
0x0D = "fighter/mage"
0x0E = "fighter/thief"
0x0F = "fighter/mage/thief"
0x10 = "mage/thief"
0x11 = "illegal type"

[enums.alignment]
0x00 = "lawful good"
0x01 = "lawful neutral"
0x02 = "lawful evil"
0x03 = "neutral good"
0x04 = "true neutral"
0x05 = "neutral evil"
0x06 = "chaotic good"
0x07 = "chaotic neutral"
0x08 = "chaotic evil"

[enums.status]
0x00 = "okay"
0x01 = "animated"
0x02 = "tempgone"
0x03 = "running"
0x04 = "unconscious"
0x05 = "dying"
0x06 = "dead"
0x07 = "stoned"
0x08 = "gone"
