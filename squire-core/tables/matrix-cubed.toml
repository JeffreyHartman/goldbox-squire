# Character record layout for Matrix Cubed.
#
# Source: docs/gbc/Resources/Character file formats/12. Matrix Cubed.txt
# from Gold Box Companion v2.65, cross-checked against the game-by-game
# comparison in `Offsets compared.txt` next to it.
#
# UNVERIFIED against a live game: no install of it was on hand when this
# table was written. The offsets and enums are the documented ones; the
# game folder and the sixty-minus transform (assumed from the engine family) await a real install.
#
# This file describes only the fields that Goldbox Squire reads or validates.
# The record holds more. Add a field here rather than adding code.

id = "matrix-cubed"
game = "Matrix Cubed"
game_folder = "MATRIX"   # unverified
start = "START.EXE"
machine = "svga_s3"
record_len = 259   # offsets 0x000 through 0x102

# One file per character: CHRDAT{slot}{index}.SAV in the save folder
[saves]
shape = "chrdat"
extension = "SAV"

[[field]]
name = "name"
offset = 0x000
len = 16          # one length byte, then fifteen characters
kind = "pascal_string"

[[field]]
name = "strength"
offset = 0x010
len = 1
kind = "u8"

[[field]]
name = "intelligence"
offset = 0x013
len = 1
kind = "u8"

[[field]]
name = "wisdom"
offset = 0x014
len = 1
kind = "u8"

[[field]]
name = "dexterity"
offset = 0x011
len = 1
kind = "u8"

[[field]]
name = "constitution"
offset = 0x012
len = 1
kind = "u8"

[[field]]
name = "charisma"
offset = 0x015
len = 1
kind = "u8"

[[field]]
name = "thac0_base"
offset = 0x033
len = 1
kind = "u8"
transform = "sixty_minus"

[[field]]
name = "race"
offset = 0x027
len = 1
kind = "u8"
enum = "race"

[[field]]
name = "class"
offset = 0x028
len = 1
kind = "u8"
enum = "class"

[[field]]
name = "age"
