# Character record layout for Champions of Krynn.
#
# Source: docs/gbc/Resources/Character file formats/05. Champions of Krynn.txt
# from Gold Box Companion v2.65, cross-checked against the game-by-game
# comparison in `Offsets compared.txt` next to it.
#
# Verified against the default-party save files the Steam install on this
# machine ships: every record decodes to a coherent character, and the
# sixty-minus armor class and THAC0 read back sane. Not yet verified against
# live emulator memory.
#
# This file describes only the fields that Goldbox Squire reads or validates.
# The record holds more. Add a field here rather than adding code.

id = "champions-of-krynn"
game = "Champions of Krynn"
game_folder = "COK"   # verified: the Steam install on this machine
start = "START.EXE"
machine = "ega"
record_len = 409   # offsets 0x000 through 0x198

# One file per character: CHRDAT{slot}{index}.SAV in the save folder
[saves]
shape = "chrdat"
extension = "SAV"

[[field]]
name = "name"
offset = 0x000
len = 16          # one length byte, then fifteen characters
kind = "pascal_string"

[[field]]
name = "strength"
offset = 0x011
len = 1
kind = "u8"

[[field]]
name = "intelligence"
offset = 0x013
len = 1
kind = "u8"

[[field]]
name = "wisdom"
offset = 0x015
len = 1
kind = "u8"

[[field]]
name = "dexterity"
offset = 0x017
len = 1
kind = "u8"

[[field]]
name = "constitution"
offset = 0x019
len = 1
kind = "u8"

[[field]]
name = "charisma"
offset = 0x01B
len = 1
kind = "u8"

[[field]]
name = "strength_exceptional"
offset = 0x01D
len = 1
kind = "u8"

[[field]]
name = "thac0_base"
offset = 0x059
len = 1
kind = "u8"
transform = "sixty_minus"

[[field]]
name = "race"
offset = 0x05A
len = 1
kind = "enum"
enum = "race"

[[field]]
name = "class"
offset = 0x05B
len = 1
kind = "enum"
enum = "class"

[[field]]
name = "age"
offset = 0x060
len = 2
kind = "u16le"

[[field]]
name = "hit_points_maximum"
offset = 0x062
len = 1
kind = "u8"

[[field]]
name = "save_paralyze"
