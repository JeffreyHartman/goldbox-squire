# The terminals Squire knows how to open a window in.
#
# Squire needs two things from a terminal: a name it can give the window, so
# that a compositor rule can find it, and a size asked for in character cells
# rather than pixels. Every terminal spells both differently and there is no
# standard, so this is a table.
#
# Only terminals that do both cleanly are listed. A terminal that is not here
# is still launched; Squire says once that it could not set the size.
#
# To add one, do not edit this file. Write the same `[[terminal]]` block into
# `terminals.toml` in Squire's own config folder, next to `config.toml`. An
# entry there with the same `name` replaces the one here, and an entry with a
# new name is added. That file is yours: Squire never writes it.
#
# Placeholders, substituted into every argument:
#
#   {id}    the window name Squire asks for, always `goldbox-squire`
#   {cols}  columns, in character cells
#   {rows}  rows, in character cells
#
# `exec` is what goes between the options and the command Squire runs. Some
# terminals need a flag there, some need nothing, and the command always comes
# last.

[[terminal]]
name = "foot"
app_id = ["--app-id={id}"]
size = ["--window-size-chars={cols}x{rows}"]
exec = []

[[terminal]]
name = "alacritty"
app_id = ["--class={id},{id}"]
size = [
    "-o",
    "window.dimensions.columns={cols}",
    "-o",
    "window.dimensions.lines={rows}",
]
# Alacritty's own help says the command must be the last argument.
exec = ["-e"]

[[terminal]]
name = "kitty"
app_id = ["--app-id={id}"]
# The `c` suffix is what makes these cells rather than pixels.
size = [
    "-o",
    "initial_window_width={cols}c",
    "-o",
    "initial_window_height={rows}c",
]
exec = []
