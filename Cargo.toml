[workspace]
resolver = "2"
members = ["squire-core", "squire-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.80"

[workspace.dependencies]
nix = { version = "0.29", features = ["uio", "process", "signal", "poll"] }
libc = "0.2"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
